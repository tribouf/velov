name: Image

# Builds Vélo'v Control for the Raspberry Pi 5 (arm64) and publishes it to GHCR after each merge to main.
# The Pi's fast lane (pi-stacks, stacks/velov) picks up the new :latest about a minute later.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          cache-from: type=gha,scope=velov
          cache-to: type=gha,mode=max,scope=velov
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/velov:latest
            ghcr.io/${{ github.repository_owner }}/velov:${{ github.sha }}
