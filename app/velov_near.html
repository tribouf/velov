<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vélo'v Près de moi</title>
<meta name="theme-color" content="#d6001c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vélo'v">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/static/near.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/static/near-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/near-180.png">
<style>
:root{
  --bg:#f4f3f0; --panel:#ffffff; --ink:#1d1f22; --muted:#6b6f76; --line:#e6e3de;
  --accent:#d6001c; --mech:#d6001c; --elec:#2463c7; --dock:#6f7782; --warn:#e8a317;
  --chip:#ecebe7; --chip-on:#1d1f22; --chip-on-ink:#fff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0f1012; --panel:#1a1c1f; --ink:#ecebe8; --muted:#9a9ea5; --line:#2a2d31; --chip:#24272b; --chip-on:#ecebe8; --chip-on-ink:#111; --elec:#5b9bff; --dock:#a3a9b1; }
}
:root[data-theme="dark"]{ --bg:#0f1012; --panel:#1a1c1f; --ink:#ecebe8; --muted:#9a9ea5; --line:#2a2d31; --chip:#24272b; --chip-on:#ecebe8; --chip-on-ink:#111; --elec:#5b9bff; --dock:#a3a9b1; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:21px;margin:0;letter-spacing:-.02em} h1 b{color:var(--accent)}
.age{font-size:12.5px;color:var(--muted)}
.iconbtn{border:0;background:var(--chip);color:var(--ink);width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer;flex:none}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:14px;padding:4px;margin:14px 0 10px}
.seg button{border:0;background:none;color:var(--ink);font:inherit;font-weight:600;font-size:15px;padding:10px;border-radius:11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.opts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:0;background:var(--chip);color:var(--ink);padding:7px 12px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
#where{font-size:13px;color:var(--muted);margin:10px 0 0;display:flex;gap:8px;align-items:center}
#search{width:100%;font:inherit;font-size:16px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);margin-top:10px}
#radarWrap{display:flex;justify-content:center;margin:12px 0 4px}
#radar{width:min(300px,82vw);height:min(300px,82vw);touch-action:manipulation}
.list{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.card{background:var(--panel);border-radius:16px;padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:pointer;border:1px solid transparent}
.card.sel{border-color:var(--ink)}
.top{display:grid;grid-template-columns:58px 1fr 44px;gap:12px;align-items:center}
.big{font-size:30px;font-weight:800;letter-spacing:-.03em;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.big small{display:block;font-size:11.5px;font-weight:600;letter-spacing:0;color:var(--muted);margin-top:3px;text-transform:uppercase}
.nm{font-weight:650;font-size:15.5px;line-height:1.2}
.meta{font-size:13px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.arrow{width:40px;height:40px;border-radius:50%;background:var(--chip);display:grid;place-items:center;transition:transform .25s}
.arrow svg{width:20px;height:20px}
.bar{display:flex;height:7px;border-radius:4px;overflow:hidden;margin-top:10px;background:var(--chip)}
.bar i{display:block}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:6px}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.trend{font-variant-numeric:tabular-nums}
.more{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.rack{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px}
.slot{border-radius:9px;padding:6px 8px;background:var(--chip);font-size:12.5px;font-variant-numeric:tabular-nums}
.slot .n{font-weight:700;font-size:13.5px}
.slot.e{box-shadow:inset 3px 0 0 var(--elec)} .slot.m{box-shadow:inset 3px 0 0 var(--mech)} .slot.free{opacity:.45}
.stars{color:#e8a317;letter-spacing:.5px}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:0;background:var(--ink);color:var(--panel);border-radius:11px;padding:10px 14px;font:inherit;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer}
.btn.ghost{background:var(--chip);color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.fav{border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted);padding:0}
.fav.on{color:#e8a317}
.note{font-size:12px;color:var(--muted);margin-top:16px;text-align:center}
[hidden]{display:none!important}
</style>
<script>/* inside the Vélo'v Control app the tab already names the page */
try{ if(window.top!==window.self) document.documentElement.classList.add('embedded'); }catch(e){ document.documentElement.classList.add('embedded'); }</script>
<style>html.embedded h1{display:none}
@media (pointer:coarse){ .chip{min-height:40px} }</style>
</head>
<body>
<main>
  <header>
    <div><h1>Vélo'v <b>Près de moi</b></h1><div class="age" id="age">Chargement…</div></div>
    <div style="display:flex;gap:8px"><button class="iconbtn" id="compassBtn" title="Boussole" aria-label="Activer la boussole">🧭</button><button class="iconbtn" id="refresh" title="Actualiser" aria-label="Actualiser">↻</button></div>
  </header>

  <div class="seg" role="group" aria-label="Je cherche">
    <button data-m="bike">🚲 Un vélo</button>
    <button data-m="dock">🅿 Une place</button>
  </div>
  <div class="opts">
    <button class="chip" data-k="all">Tous les vélos</button>
    <button class="chip" data-k="elec">⚡ Électriques</button>
    <button class="chip" data-k="mech">Mécaniques</button>
  </div>
  <div id="where"></div>
  <input id="search" type="search" placeholder="Chercher une station ou un lieu (ex. Opéra, Charpennes)" autocomplete="off" hidden>

  <div id="radarWrap"><svg id="radar" viewBox="-150 -150 300 300" aria-label="Stations autour de vous"></svg></div>
  <div class="list" id="list"></div>
  <p class="note" id="foot"></p>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
                set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
let S = Object.assign({mode:'bike', kind:'all', favs:[], last:null}, store.get('velovNear',{}));
let D=null, me=null, meAcc=null, heading=null, open=null, manual=null;

/* ---------- maths ---------- */
const R_ = 6371000, rad = d=>d*Math.PI/180;
function dist(a,b){ const dl=rad(b[0]-a[0]), dn=rad(b[1]-a[1]); const h=Math.sin(dl/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dn/2)**2; return 2*R_*Math.asin(Math.sqrt(h)); }
function bearing(a,b){ const y=Math.sin(rad(b[1]-a[1]))*Math.cos(rad(b[0])), x=Math.cos(rad(a[0]))*Math.sin(rad(b[0]))-Math.sin(rad(a[0]))*Math.cos(rad(b[0]))*Math.cos(rad(b[1]-a[1])); return (Math.atan2(y,x)*180/Math.PI+360)%360; }
const mtxt = m => m<1000 ? Math.round(m/10)*10+' m' : (m/1000).toFixed(1).replace('.',',')+' km';
const walk = m => Math.max(1,Math.round(m*1.25/80));
const ago = t => { const s=(Date.now()-new Date(t))/1000; return s<90?'à l’instant':s<3600?`il y a ${Math.round(s/60)} min`:`il y a ${Math.round(s/3600)} h`; };

/* ---------- data ---------- */
async function load(){
  try{
    const r=await fetch('/api/x/near'); const d=await r.json(); if(!r.ok||d.error) throw new Error(d.error||r.statusText);
    D=d; render();
  }catch(e){ $('age').textContent='Données indisponibles ('+e.message+')'; }
}
function value(s){ // s = [number,name,lat,lng,stands,bikes,mech,elec,docks,open,trend]
  if(!s[9]) return 0;
  if(S.mode==='dock') return s[8]||0;
  return S.kind==='elec' ? s[7]||0 : S.kind==='mech' ? s[6]||0 : s[5]||0;
}
function origin(){ return manual ? manual.ll : me; }
function ranked(){
  const o=origin(); if(!o||!D) return [];
  return D.stations.map(s=>({s, d:dist(o,[s[2],s[3]]), v:value(s)})).sort((a,b)=>a.d-b.d);
}

/* ---------- rendering ---------- */
function render(){
  document.querySelectorAll('[data-m]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.m===S.mode));
  document.querySelectorAll('[data-k]').forEach(b=>{ b.setAttribute('aria-pressed', b.dataset.k===S.kind); b.hidden = S.mode==='dock'; });
  store.set('velovNear', S);
  if(!D) return;
  const old = Date.now()-new Date(D.at) > 20*60000;
  $('age').innerHTML = `${old?'<span style="color:var(--warn);font-weight:600">⚠ ':''}Relevé ${ago(D.at)} · ${new Date(D.at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}${old?'</span> — touchez une station pour les vélos en direct':''}`;
  const o=origin();
  $('where').innerHTML = manual ? `📍 Autour de <b>${esc(manual.name)}</b> <button class="chip" id="useGps">Ma position</button>`
    : me ? `📍 Votre position${meAcc?` (± ${Math.round(meAcc)} m)`:''}` : (geoMsg || 'Localisation…');
  if($('useGps')) $('useGps').onclick=()=>{ manual=null; $('search').value=''; startGeo(); render(); };
  $('search').hidden = !!me && !manual && !searchOpen;
  if(!o){ $('list').innerHTML = `<div class="empty">${geoMsg?'Cherchez une station ci-dessus pour voir ce qu’il y a autour.':'Recherche de votre position…'}</div>`; $('radar').innerHTML=''; favList(); return; }
  const all=ranked(), near=all.slice(0,40);
  // the closest useful stations first, but never skip a very close one
  const useful = near.filter(x=>x.v>0).slice(0,6);
  const closest = near[0] && !useful.includes(near[0]) ? [near[0]] : [];
  const shown = [...closest, ...useful].sort((a,b)=>a.d-b.d).slice(0,7);
  drawRadar(near.slice(0,30), shown, o);
  $('list').innerHTML = shown.length ? '' : '<div class="empty">Rien de disponible à proximité.</div>';
  shown.forEach(x=>$('list').appendChild(card(x, o)));
  favList();
  $('foot').innerHTML = `Distances à vol d’oiseau ; minutes à pied estimées. Tendance = variation du nombre de vélos sur la dernière heure.`;
}
function card({s,d,v}, o){
  const el=document.createElement('div'); el.className='card'+(open===s[0]?' sel':''); el.dataset.n=s[0];
  const [n,name,la,lo,stands,bikes,mech,elec,docks,isOpen,trend]=s;
  const tot=Math.max(1,(bikes||0)+(docks||0)), col = v===0?'var(--muted)': S.mode==='dock'?'var(--dock)': v<=2?'var(--warn)': S.kind==='elec'?'var(--elec)': S.kind==='mech'?'var(--mech)':'var(--ink)';
  const b = bearing(o,[la,lo]), rot = heading==null ? b : b-heading;
  const tr = trend==null||trend===0 ? '' : `<span class="trend" style="color:${trend<0?'var(--mech)':'var(--elec)'}">${trend<0?'↘':'↗'} ${trend>0?'+':''}${trend} vélo${Math.abs(trend)>1?'s':''} en 1 h</span>`;
  const fav=S.favs.includes(n);
  el.innerHTML = `<div class="top">
      <div class="big" style="color:${col}">${isOpen?v:'—'}<small>${!isOpen?'fermée':S.mode==='dock'?'place'+(v>1?'s':''):S.kind==='elec'?'élec.':S.kind==='mech'?'méca.':'vélo'+(v>1?'s':'')}</small></div>
      <div><div class="nm">${esc(name)}</div>
        <div class="meta"><span>${mtxt(d)} · ${walk(d)} min à pied</span>${tr}</div></div>
      <div class="arrow" style="transform:rotate(${rot}deg)" aria-label="Direction ${Math.round(b)}°"><svg viewBox="0 0 20 20"><path d="M10 2 L16 17 L10 13 L4 17 Z" fill="currentColor"/></svg></div>
    </div>
    <div class="bar"><i style="width:${100*(mech||0)/tot}%;background:var(--mech)"></i><i style="width:${100*(elec||0)/tot}%;background:var(--elec)"></i><i style="width:${100*(docks||0)/tot}%;background:var(--dock);opacity:.35"></i></div>
    <div class="legend"><span><b>${mech??'–'}</b> méca</span><span><b>${elec??'–'}</b> élec</span><span><b>${docks??'–'}</b> places</span><span style="margin-left:auto"><button class="fav ${fav?'on':''}" aria-label="Favori">${fav?'★':'☆'}</button></span></div>
    <div class="more" ${open===n?'':'hidden'}></div>`;
  el.querySelector('.fav').onclick = e => { e.stopPropagation(); S.favs = fav ? S.favs.filter(x=>x!==n) : [...S.favs, n]; render(); };
  el.onclick = () => { open = open===n ? null : n; render(); if(open===n) rack(n); };
  if(open===n) setTimeout(()=>rack(n),0);
  return el;
}
const rackCache=new Map();
async function rack(n){
  const box=document.querySelector(`.card[data-n="${n}"] .more`); if(!box) return;
  const s=D.stations.find(x=>x[0]===n);
  const nav=`<div class="actions"><a class="btn" href="https://www.google.com/maps/dir/?api=1&destination=${s[2]},${s[3]}&travelmode=walking" target="_blank" rel="noopener">🚶 Itinéraire</a>
    <button class="btn ghost" id="rk${n}">↻ Vélos en direct</button></div>`;
  const hit=rackCache.get(n);
  if(!hit || Date.now()-hit.t>60000){ box.innerHTML='<div class="age">Vélos de la station…</div>'+nav;
    try{ const r=await fetch('/api/x/docks?n='+n); const d=await r.json(); if(!r.ok||d.error&&!d.docks) throw new Error(d.error||r.statusText); rackCache.set(n,{t:Date.now(),d}); }
    catch(e){ box.innerHTML=`<div class="age">Détail indisponible (${esc(e.message)}).</div>`+nav; return; } }
  const d=rackCache.get(n).d, bikes=d.docks.filter(x=>x.bike && !x.bike.foreign);
  bikes.sort((a,b)=>(b.bike.type==='ELECTRICAL')-(a.bike.type==='ELECTRICAL') || (b.bike.stars??-1)-(a.bike.stars??-1));
  const stars = b => b.stars==null ? '' : b.stars===0 ? '<span style="color:var(--elec)">✓ révisé</span>' : `<span class="stars">${'★'.repeat(b.stars)}${'☆'.repeat(3-b.stars)}</span>`;
  box.innerHTML = `<div class="age" style="margin-bottom:8px">${d.live?'En direct':'Dernier relevé'} · ${d.at?new Date(d.at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):''}${d.counts.reserved?` · ${d.counts.reserved} réservé${d.counts.reserved>1?'s':''}`:''}</div>
    <div class="rack">${bikes.map(x=>{ const b=x.bike, e=b.type==='ELECTRICAL';
      return `<div class="slot ${e?'e':'m'}"><div class="n">${b.number??'?'}</div><div>${e?'⚡'+(b.battery!=null?` ${b.battery} %`:''):'méca'} · borne ${x.stand}</div><div>${stars(b)}${b.reserved?' · réservé':''}</div></div>`; }).join('') || '<div class="age">Aucun vélo.</div>'}</div>` + nav;
  $('rk'+n).onclick = e => { e.stopPropagation(); rackCache.delete(n); rack(n); };
}
function favList(){
  // favourites not already on screen, as quick chips
  if(!D || !S.favs.length) return;
  const o=origin(); const shown=new Set([...document.querySelectorAll('.card')].map(c=>+c.dataset.n));
  const favs=S.favs.map(n=>D.stations.find(s=>s[0]===n)).filter(s=>s && !shown.has(s[0]));
  if(!favs.length) return;
  const wrap=document.createElement('div'); wrap.innerHTML='<div class="age" style="margin:14px 0 6px">★ Favoris</div>';
  const list=document.createElement('div'); list.className='list';
  favs.forEach(s=>list.appendChild(card({s, d:o?dist(o,[s[2],s[3]]):0, v:value(s)}, o||[s[2],s[3]])));
  wrap.appendChild(list); $('list').appendChild(wrap);
}

/* ---------- radar ---------- */
function drawRadar(near, shown, o){
  const svg=$('radar'); if(!near.length){ svg.innerHTML=''; return; }
  const far=Math.max(400, Math.min(2000, near[Math.min(near.length-1, 14)].d*1.05));
  const ring = [250,500,1000,1500,2000].filter(r=>r<=far);
  const sc=r=>Math.sqrt(r/far)*138;                   // square-root scale: close stations get room
  const h = heading ?? 0, ink=getComputedStyle(document.documentElement).getPropertyValue('--muted');
  const shownSet=new Set(shown.map(x=>x.s[0]));
  let out=`<circle r="140" fill="var(--panel)"/>`+ring.map(r=>`<circle r="${sc(r)}" fill="none" stroke="var(--line)"/><text x="3" y="${-sc(r)+12}" font-size="9" fill="${ink}">${mtxt(r)}</text>`).join('');
  out+=`<g transform="rotate(${-h})"><text y="-126" text-anchor="middle" font-size="11" font-weight="700" fill="var(--accent)">N</text>`;
  near.forEach(({s,d,v})=>{ if(d>far) return; const b=rad(bearing(o,[s[2],s[3]])), r=sc(d), x=Math.sin(b)*r, y=-Math.cos(b)*r;
    const col = v===0?'var(--muted)':S.mode==='dock'?'var(--dock)':v<=2?'var(--warn)':S.kind==='mech'?'var(--mech)':'var(--elec)';
    const rr = 3.5+Math.min(9,Math.sqrt(v)*2.2), sel=shownSet.has(s[0]);
    out+=`<g data-n="${s[0]}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${rr}" fill="${col}" opacity="${v?0.9:.35}" ${sel?'stroke="var(--ink)" stroke-width="1.5"':''}/>${sel&&v?`<text x="${x}" y="${y+3.5}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff" transform="rotate(${h} ${x} ${y})">${v}</text>`:''}</g>`; });
  out+=`</g><circle r="6" fill="var(--accent)" stroke="var(--panel)" stroke-width="2.5"/>`;
  if(heading!=null) out+=`<path d="M0 -15 L5 -6 L-5 -6 Z" fill="var(--accent)"/>`;
  svg.innerHTML=out;
  svg.querySelectorAll('[data-n]').forEach(g=>g.onclick=()=>{ open=+g.dataset.n; render(); document.querySelector(`.card[data-n="${open}"]`)?.scrollIntoView({behavior:'smooth',block:'center'}); });
}

/* ---------- position & compass ---------- */
let geoMsg='', searchOpen=false, watchId=null;
function startGeo(){
  if(!('geolocation' in navigator) || !window.isSecureContext){
    geoMsg = window.isSecureContext ? 'Pas de localisation sur cet appareil.' : 'Localisation possible seulement via l’adresse https (tunnel) ; cherchez une station.';
    searchOpen=true; render(); return; }
  if(watchId!=null) return;
  watchId = navigator.geolocation.watchPosition(p=>{ me=[p.coords.latitude,p.coords.longitude]; meAcc=p.coords.accuracy; geoMsg=''; if(!manual) render(); },
    e=>{ geoMsg = e.code===1 ? 'Localisation refusée : cherchez une station.' : 'Position introuvable pour l’instant.'; searchOpen=true; watchId=null; render(); },
    {enableHighAccuracy:true, maximumAge:15000, timeout:20000});
}
function onOrient(e){
  let h = e.webkitCompassHeading ?? (e.absolute && e.alpha!=null ? 360-e.alpha : null);
  if(h==null) return; heading=(h+(screen.orientation?.angle||0))%360;
  if(!onOrient.t){ onOrient.t=setTimeout(()=>{ onOrient.t=null; render(); },250); }
}
$('compassBtn').onclick = async () => {
  try{ if(typeof DeviceOrientationEvent!=='undefined' && DeviceOrientationEvent.requestPermission){ const r=await DeviceOrientationEvent.requestPermission(); if(r!=='granted') return; } }catch(e){ return; }
  addEventListener('deviceorientationabsolute', onOrient, true); addEventListener('deviceorientation', onOrient, true);
  $('compassBtn').style.background='var(--chip-on)'; $('compassBtn').style.color='var(--chip-on-ink)';
};

/* ---------- search ---------- */
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
$('search').addEventListener('input',()=>{
  const q=norm($('search').value.trim()); if(q.length<2||!D) return;
  const hits=D.stations.filter(s=>norm(s[1]).includes(q)).slice(0,1);
  if(hits[0]){ manual={name:hits[0][1], ll:[hits[0][2],hits[0][3]]}; S.last=manual; render(); }
});

/* ---------- controls ---------- */
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ S.mode=b.dataset.m; render(); });
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ S.kind=b.dataset.k; render(); });
$('refresh').onclick=()=>{ rackCache.clear(); load(); };
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) load(); });
setInterval(()=>{ if(!document.hidden) load(); }, 60000);
if(S.last && !window.isSecureContext) manual=S.last;
startGeo(); load();
</script>
</body>
</html>
